<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Irrigation Pro Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 sm:p-6 flex flex-col items-center min-h-screen">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-emerald-600 text-white p-5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">Smart Irrigation PRO</h1>
                    <p class="text-xs text-emerald-100">Cloud Connected Dashboard</p>
                </div>
            </div>
            <div class="bg-white/10 px-3 py-1 rounded-full text-xs font-semibold flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="connection-status">Cloud Live</span>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="p-5 space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Soil Moisture Card -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center flex flex-col justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Soil Moisture Sensor</span>
                    <div class="my-3">
                        <span id="soil-display" class="text-3xl font-black text-slate-800">--</span>
                        <span class="text-xs text-slate-500 block mt-1">ADC Value</span>
                    </div>
                    <span id="soil-status" class="text-xs font-semibold px-2 py-1 bg-slate-200 text-slate-600 rounded-md">Fetching data...</span>
                </div>

                <!-- Valve Status Card -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center flex flex-col justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">230V Solenoid Valve</span>
                    <div class="my-3">
                        <div id="valve-badge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-slate-200 text-slate-600">
                            UNKNOWN
                        </div>
                    </div>
                    <span class="text-xs text-slate-500">Hardware Relay #1</span>
                </div>
            </div>

            <!-- Operational Control Panel -->
            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 space-y-3">
                <h2 class="text-xs font-bold text-emerald-800 uppercase tracking-wider"><i class="fa-solid fa-sliders mr-1.5"></i> Manual Cloud Overrides</h2>
                
                <div class="flex gap-3">
                    <button onclick="sendCloudCommand('valve-status', 1)" class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-faucet-drip"></i>
                        <span>Force Open Valve</span>
                    </button>
                    
                    <button onclick="sendCloudCommand('valve-status', 0)" class="flex-1 py-2.5 px-4 bg-slate-600 hover:bg-slate-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-ban"></i>
                        <span>Force Close Valve</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-slate-50 p-3 text-center text-[10px] text-slate-400 border-t border-slate-200">
            Powered by GitHub Pages & Adafruit IO REST API
        </div>

    </div>

    <!-- JavaScript Integration Script -->
    <script>
        // --- YOUR ADAFRUIT IO CREDENTIALS ---
        const AIO_USERNAME = "Your_Adafruit_IO_Username";
        const AIO_KEY = "aio_Your_Adafruit_IO_Key_Here";

        // Function to fetch latest feed data from Adafruit IO
        function fetchTelemetry() {
            // Fetch Soil Moisture
            fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/soil-moisture/data/last`, {
                headers: { 'X-AIO-Key': AIO_KEY }
            })
            .then(res => res.json())
            .then(data => {
                let adcVal = parseInt(data.value);
                document.getElementById('soil-display').innerText = adcVal + " ADC";
                
                let statusEl = document.getElementById('soil-status');
                if (adcVal >= 2800) {
                    statusEl.innerText = "Dry (Needs Water)";
                    statusEl.className = "text-xs font-semibold px-2 py-1 bg-amber-100 text-amber-700 rounded-md";
                } else {
                    statusEl.innerText = "Optimal Moisture";
                    statusEl.className = "text-xs font-semibold px-2 py-1 bg-emerald-100 text-emerald-700 rounded-md";
                }
            })
            .catch(err => console.error("Error fetching soil moisture:", err));

            // Fetch Valve Status
            fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/valve-status/data/last`, {
                headers: { 'X-AIO-Key': AIO_KEY }
            })
            .then(res => res.json())
            .then(data => {
                let valveOpen = parseInt(data.value) === 1;
                let badge = document.getElementById('valve-badge');
                if (valveOpen) {
                    badge.innerText = "OPEN (ON)";
                    badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-700";
                } else {
                    badge.innerText = "CLOSED";
                    badge.className = "inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-slate-200 text-slate-600";
                }
            })
            .catch(err => console.error("Error fetching valve status:", err));
        }

        // Function to send command data back to Adafruit IO feed
        function sendCloudCommand(feedName, value) {
            fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${feedName}/data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-AIO-Key': AIO_KEY
                },
                body: JSON.stringify({ value: value })
            })
            .then(res => res.json())
            .then(data => {
                console.log(`Command sent to ${feedName}:`, data);
                alert("Command sent successfully to ESP32 via cloud!");
                setTimeout(fetchTelemetry, 1000); // Refresh UI after brief delay
            })
            .catch(err => {
                console.error("Error posting command:", err);
                alert("Failed to send command.");
            });
        }

        // Poll cloud feeds every 10 seconds automatically
        setInterval(fetchTelemetry, 10000);
        
        // Fetch immediately on page load
        fetchTelemetry();
    </script>
</body>
</html>
